<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Áreas</title>
<style>
  :root {
    --ink: #1C1C1A;
    --pessoal: #FF87D5;
    --medicina: #D9DA51;
    --formatura: #EC5F3F;
    --comissao: #F09947;
    --residencia: #8F91E0;
    --faculdade: #8F8E49;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 4px 0;
  }

  .areas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 12px;
    width: 100%;
  }

  .area-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .area {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 20px;
    width: 100%;
    height: 150px;
    min-height: 150px;
    padding: 28px 32px 26px;
    border-radius: 0;
    color: var(--ink);
    text-decoration: none;
    background-color: var(--tint);
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    will-change: transform;
  }

  .area__label {
    display: block;
    width: 100%;
    padding: 3px 6px;
    border: 1px solid var(--tint);
    color: var(--tint);
    background: #fff;
    font-family: sans-serif;
    font-size: 18px;
    text-transform: uppercase;
    line-height: 1.2;
    text-align: center;
  }

  .area:hover {
    transform: translateY(-2px);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.10);
    filter: saturate(1.04);
  }

  .area:active { transform: translateY(0); }

  .area:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .area__seta {
    font-size: 15px;
    line-height: 1;
    opacity: .55;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .area:hover .area__seta {
    opacity: .9;
    transform: translateX(2px);
  }

  .area--pessoal    { --tint: var(--pessoal); }
  .area--medicina   { --tint: var(--medicina); }
  .area--formatura  { --tint: var(--formatura); }
  .area--comissao   { --tint: var(--comissao); }
  .area--residencia { --tint: var(--residencia); }
  .area--faculdade  { --tint: var(--faculdade); }

  .area-item:has(.area--pessoal) { --tint: var(--pessoal); }
  .area-item:has(.area--medicina) { --tint: var(--medicina); }
  .area-item:has(.area--formatura) { --tint: var(--formatura); }
  .area-item:has(.area--comissao) { --tint: var(--comissao); }
  .area-item:has(.area--residencia) { --tint: var(--residencia); }
  .area-item:has(.area--faculdade) { --tint: var(--faculdade); }

  @media (max-width: 520px) {
    .areas { gap: 10px; }
    .area { min-height: 150px; padding: 24px 26px 22px; gap: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .area, .area__seta { transition: none; }
    .area:hover { transform: none; }
    .area:hover .area__seta { transform: none; }
  }
</style>
</head>
<body>
  <nav class="areas" aria-label="Áreas do Notion">
    <div class="area-item">
    <a class="area area--pessoal" href="https://app.notion.com/p/med26/Pessoal-4096f65f7fbd80d3be8beec1a5ab662c" aria-label="Pessoal">
    </a>
      <span class="area__label">Pessoal</span>
    </div>
    <div class="area-item">
    <a class="area area--medicina" href="https://app.notion.com/p/med26/Medicina-4096f65f7fbd809cb0a6e5ff5b735381" aria-label="Medicina">
    </a>
      <span class="area__label">Medicina</span>
    </div>
    <div class="area-item">
    <a class="area area--formatura" href="https://app.notion.com/p/med26/Formatura-4096f65f7fbd8068ad3ccd6506213404" aria-label="Formatura">
    </a>
      <span class="area__label">Formatura</span>
    </div>
    <div class="area-item">
    <a class="area area--comissao" href="https://app.notion.com/p/med26/Comiss-o-4096f65f7fbd801c943ee0085969f3c4" aria-label="Comissão">
    </a>
      <span class="area__label">Comissão</span>
    </div>
    <div class="area-item">
    <a class="area area--residencia" href="https://app.notion.com/p/med26/Resid-ncia-4096f65f7fbd808aa8c9f92e8c66ee15" aria-label="Residência">
    </a>
      <span class="area__label">Residência</span>
    </div>
    <div class="area-item">
    <a class="area area--faculdade" href="https://app.notion.com/p/med26/Faculdade-4096f65f7fbd80b1989defbc55ea6121" aria-label="Faculdade">
    </a>
      <span class="area__label">Faculdade</span>
    </div>
  </nav>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Áreas</title>
<style>
  :root {
    --ink: #1C1C1A;
    --pessoal: #FF87D5;
    --medicina: #D9DA51;
    --formatura: #EC5F3F;
    --comissao: #F09947;
    --residencia: #8F91E0;
    --faculdade: #8F8E49;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 4px 0;
  }

  .areas {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
    max-width: 1120px;
    margin: 0 auto;
  }

  .area {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 20px;
    min-height: 108px;
    padding: 14px 16px 13px;
    border-radius: 10px;
    color: var(--ink);
    text-decoration: none;
    background-color: var(--tint);
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    will-change: transform;
  }

  .area:hover {
    transform: translateY(-2px);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.10);
    filter: saturate(1.04);
  }

  .area:active { transform: translateY(0); }

  .area:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .area__nome {
    font-size: clamp(15px, 1.35vw, 19px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }

  .area__seta {
    font-size: 15px;
    line-height: 1;
    opacity: .55;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .area:hover .area__seta {
    opacity: .9;
    transform: translateX(2px);
  }

  .area--pessoal    { --tint: var(--pessoal); }
  .area--medicina   { --tint: var(--medicina); }
  .area--formatura  { --tint: var(--formatura); }
  .area--comissao   { --tint: var(--comissao); }
  .area--residencia { --tint: var(--residencia); }
  .area--faculdade  { --tint: var(--faculdade); }

  @media (max-width: 900px) {
    .areas { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 520px) {
    .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .area { min-height: 92px; padding: 12px 13px 11px; gap: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .area, .area__seta { transition: none; }
    .area:hover { transform: none; }
    .area:hover .area__seta { transform: none; }
  }
</style>
</head>
<body>
  <nav class="areas" aria-label="Áreas do Notion">
    <a class="area area--pessoal" href="https://app.notion.com/p/med26/Pessoal-4096f65f7fbd80d3be8beec1a5ab662c">
      <span class="area__nome">Pessoal</span>
      <span class="area__seta" aria-hidden="true">→</span>
    </a>
    <a class="area area--medicina" href="https://app.notion.com/p/med26/Medicina-4096f65f7fbd809cb0a6e5ff5b735381">
      <span class="area__nome">Medicina</span>
      <span class="area__seta" aria-hidden="true">→</span>
    </a>
    <a class="area area--formatura" href="https://app.notion.com/p/med26/Formatura-4096f65f7fbd8068ad3ccd6506213404">
      <span class="area__nome">Formatura</span>
      <span class="area__seta" aria-hidden="true">→</span>
    </a>
    <a class="area area--comissao" href="https://app.notion.com/p/med26/Comiss-o-4096f65f7fbd801c943ee0085969f3c4">
      <span class="area__nome">Comissão</span>
      <span class="area__seta" aria-hidden="true">→</span>
    </a>
    <a class="area area--residencia" href="https://app.notion.com/p/med26/Resid-ncia-4096f65f7fbd808aa8c9f92e8c66ee15">
      <span class="area__nome">Residência</span>
      <span class="area__seta" aria-hidden="true">→</span>
    </a>
    <a class="area area--faculdade" href="https://app.notion.com/p/med26/Faculdade-4096f65f7fbd80b1989defbc55ea6121">
      <span class="area__nome">Faculdade</span>
      <span class="area__seta" aria-hidden="true">→</span>
    </a>
  </nav>
</body>
</html>
